[package]
name = "susurro"
version = "0.1.0"
description = "System-wide voice dictation"
authors = ["Pablo Perez"]
edition = "2024"

[lib]
name = "susurro_lib"
# rlib only: desktop app. staticlib/cdylib (mobile) made `cargo test --release` link a panic=abort lib into unwind tests.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-log = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
chrono = "0.4"
ts-rs = "12"
unicode-normalization = "0.1"
base64 = "0.23"
cpal = "0.18"
rubato = "5"
audioadapter-buffers = "5.2"
hound = "3.5"
whisper-rs = { version = "0.16", features = ["metal"] }
reqwest = { version = "0.13", features = ["blocking", "json", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-application-services = "0.3.2"
objc2-av-foundation = "0.3.2"
block2 = "0.6"

[dev-dependencies]
mockito = "1.7"
proptest = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
